name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: financeiq
          POSTGRES_PASSWORD: financeiq
          POSTGRES_DB: financeiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeiq"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://financeiq:financeiq@localhost:5432/financeiq
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app
